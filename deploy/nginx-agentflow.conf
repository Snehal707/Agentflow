# Live VPS site config for agentflow.one (copied from /etc/nginx/sites-available/agentflow).
# Apply: sudo cp deploy/nginx-agentflow.conf /etc/nginx/sites-available/agentflow && sudo nginx -t && sudo systemctl reload nginx
#
# client_max_body_size must stay above the app attachment limits (images 6MB)
# so nginx does not return 413 before /api/attachments/validate.

server {
    listen 80;
    server_name agentflow.one www.agentflow.one;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name agentflow.one www.agentflow.one;

    ssl_certificate /etc/letsencrypt/live/agentflow.one/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agentflow.one/privkey.pem;

    # App attachment limit is 6MB; multipart overhead needs headroom.
    client_max_body_size 10M;

    proxy_buffer_size 128k;
    proxy_buffers 8 128k;
    proxy_busy_buffers_size 256k;

    # Direct backend routes used by the browser and Next proxy helpers.
    location ~ ^/api/(auth|access|wallet|telegram|settings|agentpay|business|pay|agent-store|agent-ratings|agent-economy-ledger|portfolio|stats|docs|research|invoice|schedule|split|batch|x402|media|internal|brain|profile|chat|dcw)(/|$) {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    location /run {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location /health {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Frontend - everything else
    location / {
        proxy_pass http://localhost:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
