services:
  research-index:
    image: getmeili/meilisearch:v1.15
    restart: unless-stopped
    ports:
      - "127.0.0.1:7700:7700"
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in the VPS environment}
      MEILI_NO_ANALYTICS: "true"
      MEILI_MAX_INDEXING_MEMORY: "1610612736"
      MEILI_MAX_INDEXING_THREADS: "2"
      MEILI_LOG_LEVEL: INFO
    volumes:
      - research-index-data:/meili_data
    mem_limit: 2g
    cpus: 2.0
volumes:
  research-index-data:
